name: Render 3D Animation
on:
  workflow_dispatch:
  push:
    paths:
      - 'render.py'
      - '.github/workflows/render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libxrender1 libxi6
      - name: Render MP4
        run: |
          mkdir -p output
          blender -b --python render.py
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: bablu-pappu-mp4
          path: output/bablu_pappu_well.mp4
          if-no-files-found: error
          retention-days: 7
